name: Repair water ambience encoding
on:
  push:
    paths: ['.github/workflows/repair-water.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download CC0 water recording
        run: |
          curl --fail --location --retry 2 -A "CaroSoundtrack/1.0 (https://github.com/vanty1xxx-coder/caro)" https://upload.wikimedia.org/wikipedia/commons/8/84/Swale.ogg -o /tmp/water.ogg
      - name: Encode and validate water loop
        run: |
          if ! command -v ffmpeg > /dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffprobe -v error -show_entries format=duration,start_time -of json /tmp/water.ogg
          ffmpeg -y -hide_banner -loglevel warning -i /tmp/water.ogg -filter_complex "[0:a]asetpts=PTS-STARTPTS,asplit[a][b];[a]atrim=start=1,asetpts=PTS-STARTPTS[body];[b]atrim=end=1,asetpts=PTS-STARTPTS[head];[body][head]acrossfade=d=1:c1=tri:c2=tri[out]" -map "[out]" -codec:a libmp3lame -b:a 128k assets/music/water.mp3
          ffprobe -v error -show_entries format=duration,size -of json assets/music/water.mp3 > /tmp/probe.json
          node -e "const p=require('/tmp/probe.json').format;console.log(p);if(Number(p.duration)<15||Number(p.size)<100000)process.exit(1)"
      - name: Commit verified water audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/music/water.mp3
          git commit -m "Fix water audio timestamps and validate decoded duration"
          git push
