name: Import expanded instrumental library
on:
  push:
    paths: ['.github/workflows/import-playlists.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download licensed recordings
        env:
          TRACKS: '[{"title":"Evening","src":"assets/music/relax.mp3"},{"title":"Easy Lemon","src":"assets/music/relax-2.mp3"},{"title":"Dreams Become Real","src":"assets/music/relax-3.mp3"},{"title":"Clean Soul","src":"assets/music/relax-4.mp3"},{"title":"Cattails","src":"assets/music/relax-5.mp3"},{"title":"Study And Relax","src":"assets/music/lofi.mp3"},{"title":"Night in Venice","src":"assets/music/lofi-2.mp3"},{"title":"Late Night Radio","src":"assets/music/lofi-3.mp3"},{"title":"On Hold for You","src":"assets/music/lofi-4.mp3"},{"title":"Pleasant Porridge","src":"assets/music/lofi-5.mp3"},{"title":"Jazz Brunch","src":"assets/music/jazz.mp3"},{"title":"Sidewalk Shade - slower","src":"assets/music/jazz-2.mp3"},{"title":"Apero Hour","src":"assets/music/jazz-3.mp3"},{"title":"Local Forecast","src":"assets/music/jazz-4.mp3"},{"title":"Airport Lounge","src":"assets/music/jazz-5.mp3"},{"title":"Shenyang","src":"assets/music/asian.mp3"},{"title":"Senbazuru","src":"assets/music/asian-2.mp3"},{"title":"Ishikari Lore","src":"assets/music/asian-3.mp3"},{"title":"Finding Movement","src":"assets/music/asian-4.mp3"},{"title":"Guzheng City","src":"assets/music/asian-5.mp3"},{"title":"Floating Cities","src":"assets/music/electronic.mp3"},{"title":"Universal","src":"assets/music/electronic-2.mp3"},{"title":"Aerosol of my Love","src":"assets/music/electronic-3.mp3"},{"title":"Sincerely","src":"assets/music/electronic-4.mp3"},{"title":"Limit 70","src":"assets/music/electronic-5.mp3"}]'
        run: |
          node <<'NODE'
          const fs=require('node:fs/promises');
          (async()=>{for(const t of JSON.parse(process.env.TRACKS)){
            try{await fs.access(t.src);continue}catch{}
            const r=await fetch('https://incompetech.com/music/royalty-free/mp3-royaltyfree/'+encodeURIComponent(t.title+'.mp3'));
            if(!r.ok)throw Error(t.title+': '+r.status);
            const b=Buffer.from(await r.arrayBuffer());if(b.length<100000)throw Error('Invalid audio '+t.title);
            await fs.writeFile(t.src,b);console.log(t.title+': '+b.length+' bytes');
          }const r=await fetch('https://upload.wikimedia.org/wikipedia/commons/8/84/Swale.ogg',{headers:{'User-Agent':'CaroSoundtrack/1.0 (https://github.com/vanty1xxx-coder/caro)'}});
          if(!r.ok)throw Error('Water '+r.status);await fs.writeFile('/tmp/water.ogg',Buffer.from(await r.arrayBuffer()));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Prepare smooth water loop
        run: |
          if ! command -v ffmpeg > /dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffmpeg -hide_banner -loglevel error -i /tmp/water.ogg -filter_complex "[0:a]asplit[a][b];[a]atrim=start=1,asetpts=PTS-STARTPTS[body];[b]atrim=end=1,asetpts=PTS-STARTPTS[head];[body][head]acrossfade=d=1:c1=tri:c2=tri[out]" -map "[out]" -codec:a libmp3lame -b:a 128k assets/music/water.mp3
      - name: Commit library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/music
          git diff --cached --quiet || git commit -m "Expand to 25 instrumental songs and a flowing-water loop"
          git push
