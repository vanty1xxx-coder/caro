name: Import instrumental soundtrack
on:
  push:
    paths: ['.github/workflows/import-soundtrack.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download licensed instrumental recordings
        env:
          TRACKS: '[{"style":"relax","title":"Evening"},{"style":"lofi","title":"Study And Relax"},{"style":"jazz","title":"Jazz Brunch"},{"style":"asian","title":"Shenyang"},{"style":"electronic","title":"Floating Cities"}]'
        run: |
          mkdir -p assets/music
          node <<'NODE'
          const fs=require('node:fs/promises');
          (async()=>{for(const t of JSON.parse(process.env.TRACKS)){
            const url='https://incompetech.com/music/royalty-free/mp3-royaltyfree/'+encodeURIComponent(t.title+'.mp3');
            const r=await fetch(url);if(!r.ok)throw Error(t.title+': '+r.status);
            const data=Buffer.from(await r.arrayBuffer());if(data.length<100000)throw Error('Invalid audio '+t.title);
            await fs.writeFile('assets/music/'+t.style+'.mp3',data);
            console.log(t.title+': '+data.length+' bytes');
          }})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit soundtrack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/music
          git diff --cached --quiet || git commit -m "Add five licensed full instrumental recordings"
          git push
